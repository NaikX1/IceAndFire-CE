plugins {
    id 'java'
    id 'maven-publish'
    id 'fabric-loom' version '1.17.5'
    id 'idea'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

version = mod_version
group = mod_group_id

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url = "https://cursemaven.com" }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.nucleoid.xyz/' }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://modmaven.dev" }
    maven { url = "https://maven.createmod.net" }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    mavenCentral()
}

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${minecraft_mappings_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    
    // GeckoLib for Fabric
    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    
    // Curios API for Fabric
    modImplementation "top.theillusivec4.curios:curios-fabric:${curios_version}"
    
    // Optional: JEI and EMI integration (compile-only)
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:19.21.0.247"
    modCompileOnly "dev.emi:emi-fabric:1.1.19+${minecraft_version}:api"
    modRuntimeOnly "dev.emi:emi-fabric:1.1.19+${minecraft_version}"
    
    // Jade (Hwyla) for Fabric
    modImplementation "curse.maven:jade-324717:8591319"
    
    // ProjectE for Fabric (if available, compile-only)
    modCompileOnly "curse.maven:projecte-226410:6611984"
    
    // Uranus and Jupiter libraries (converted/adapted if needed for Fabric)
    modImplementation "curse.maven:uranus-1010827:8689800"
    modImplementation "curse.maven:jupiter-1072905:8621734"
}

loom {
    splitEnvironmentSourceSets()
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll([
        '-Xmaxerrs', '10000'
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "loader_version", loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": minecraft_version,
               "loader_version": loader_version
    }
}

tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            loader_version: loader_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
